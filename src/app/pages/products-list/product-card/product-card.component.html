<div
  class="bg-white shadow-md border border-transparent rounded-md p-6 flex flex-col gap-6 relative"
>
  <div class="mx-auto">
    <img
      [src]="product().image"
      alt="Product Image"
      class="w-[200px] h-[100px] object-contain"
    />
  </div>
  <div class="flex flex-col">
    <h3 class="text-md font-bold truncate">{{ product().title }}</h3>
    <p class="truncate">{{ product().description }}</p>
    <div class="price">
      <span class="text-sm">${{ product().price }}</span>
    </div>
    <app-primary-button label="Add to Cart" class="mt-3" />
  </div>
</div>
