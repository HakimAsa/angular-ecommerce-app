<div
  class="bg-white shadow-lg border border-gray-200 rounded-md p-6 flex flex-col gap-6 relative overflow-visible"
>
  <div class="mx-auto">
    <img
      [src]="product().image"
      [srcset]="`${product().image}?w=200 200w, ${product().image}?w=400 400w, ${product().image}?w=800 800w`"
      sizes="(max-width: 600px) 200px, (max-width: 1200px) 400px, 800px"
      width="200"
      height="100"
      [alt]="'Product Image ' + product().id"
      class="w-[200px] h-[100px] object-contain"
    />
  </div>
  <div class="flex flex-col">
    <h3 class="text-md font-bold truncate">{{ product().title }}</h3>
    <p class="truncate">{{ product().description }}</p>
    <div class="price">
      <span class="text-sm">${{ product().price }}</span>
    </div>
    <app-primary-button
      label="Add to Cart"
      class="mt-3"
      (btnClicked)="cartService.addToCart(product())"
    />
  </div>
  <span
    class="absolute top-2 right-3 text-sm font-bold"
    [class]="product().stock ? 'text-green-500' : 'text-red-500'"
  >
    @if (product().stock) {
    {{ product().stock }} left in stock }@else { Out of stock }
  </span>
</div>
