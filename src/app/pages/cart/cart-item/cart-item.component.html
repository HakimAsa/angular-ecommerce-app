<div
  class="bg-white shadow-lg border border-gray-200 rounded-md p-6 flex gap-6"
>
  <img
    [src]="item().image"
    [srcset]="`${item().image}?w=50 50, ${item().image}?w=50 50w`"
    sizes="(max-width: 600px) 50px, 50px"
    width="50"
    height="50"
    alt="Product Image"
    class="w-[50px] h-[50px] object-contain"
  />
  <div class="flex flex-col">
    <span class="truncate font-bold text-md">{{ item().title }}</span>
    <span class="text-sm">${{ item().price }}</span>
  </div>
  <div class="flex-1"></div>
  <app-button
    label="Remove"
    (btnClicked)="cartService.removeFromCart(item().id)"
  />
</div>
