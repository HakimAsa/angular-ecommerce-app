<div class="flex jsutify-center">
  <ul class="flex items-center gap-2">
    <!-- First Page Button -->
    <li>
      <button
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-all disabled:opacity-50"
        [disabled]="currentPage === 1"
        (click)="goToPage(1)"
      >
        «
      </button>
    </li>
    <!-- Previous button -->
    <li>
      <button
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-all"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        &lsaquo;
      </button>
      <!-- Page Numbers -->
    </li>

    @for (page of getPages(); track page) { @if (typeof page === 'number') {

    <li>
      <button
        class="px-4 py-2 rounded-lg transition-all duration-300 ease-in-out"
        [class]="
          currentPage === page
            ? 'bg-blue-500 text-white'
            : 'bg-gray-200 hover:bg-gray-300'
        "
        (click)="goToPage(+page)"
      >
        {{ page }}
      </button>
    </li>
    } @if (page === '...') {
    <li>
      <span class="px-3">...</span>
    </li>
    } }

    <!-- Next button -->
    <li>
      <button
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-all"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >
        &rsaquo;
      </button>
    </li>
    <!-- Last Page Button -->
    <li>
      <button
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-all disabled:opacity-50"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(totalPages)"
      >
        »
      </button>
    </li>
  </ul>
</div>
