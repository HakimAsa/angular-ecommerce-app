<div class="bg-slate-100 px-4 py-3 shadow-md flex justify-between items-center">
  <div class="flex">
    <button class="text-xl cursor-pointer" routerLink="/">My Store</button>
    <div class="self-center mx-4 flex">
      <button class="text-xl cursor-pointer">
        <svg
          class="w-6 h-6 text-gray-800 dark:text-white"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
          />
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.8 13.938h-.011a7 7 0 1 0-11.464.144h-.016l.14.171c.1.127.2.251.3.371L12 21l5.13-6.248c.194-.209.374-.429.54-.659l.13-.155Z"
          />
        </svg>
      </button>
      <div class="flex flex-col">
        <span class="text-md font-bold">{{ location }}</span>
        <span class="text-sm">{{ suburb }}</span>
      </div>
    </div>
  </div>
  <app-search-bar (searchEvent)="onSearchInput($event)" />
  <app-primary-button
    [label]="'Cart (' + cartService.cart().length + ')'"
    routerLink="/cart"
  />
</div>
